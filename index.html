<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SI-PANDA</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-in { animation: fadeIn 0.2s ease-out forwards, zoomIn 0.2s ease-out forwards; }
        .exam-mode { user-select: none; -webkit-user-select: none; -ms-user-select: none; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxdH2urI87l4f3mY1J15fUtmi05Rqme-BVzexy3NPgjurrKevEGaAXZrvv46mIX8XK-/exec";
        const SECRET_KEY_PARAM = 'guru'; 
        const LOGO_URL = "https://i.ibb.co.com/pjFNr8Fj/sipanda2.png"; 

        const MAPEL_LIST = [
            "Pendidikan Pancasila", 
            "Bahasa Indonesia", 
            "Matematika", 
            "IPAS", 
            "Seni Rupa", 
            "Bahasa Jawa", 
            "Bahasa Inggris", 
            "Koding & AI"
        ];

        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                'book-open': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>,
                'clock': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>,
                'alert-circle': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>,
                'check-circle': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>,
                'chevron-left': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="15 18 9 12 15 6"></polyline></svg>,
                'chevron-right': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="9 18 15 12 9 6"></polyline></svg>,
                'log-out': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>,
                'file-text': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>,
                'message-square': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>,
                'save': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>,
                'download': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>,
                'edit': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>,
                'x': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
                'list': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
            };
            return icons[name] || null;
        };

        async function hashString(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        const shuffleArray = (array) => {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        };

        const renderContent = (text) => {
            if (!text) return null;
            const parts = text.split(/\[GAMBAR:(.*?)\]/g);
            return parts.map((part, index) => {
                if (index % 2 === 1) {
                    return (
                        <img 
                            key={index} src={part.trim()} alt="Ilustrasi" 
                            className="max-w-full h-auto rounded-lg shadow-sm border border-slate-200 my-2 max-h-56 object-contain bg-white"
                            onError={(e) => { e.target.onerror = null; e.target.src = 'https://via.placeholder.com/300x150?text=Gagal+Muat+Gambar'; }}
                        />
                    );
                }
                if (!part) return null;
                return <span key={index} className="whitespace-pre-wrap">{part}</span>;
            });
        };

        function App() {
            const [currentUser, setCurrentUser] = useState(null); 
            const [view, setView] = useState('login'); 
            const [activeExamData, setActiveExamData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [selectedMapel, setSelectedMapel] = useState(null);
            
            const [appData, setAppData] = useState({ settings: {}, students: [], exams: [], results: [], materi: [] });

            useEffect(() => {
                const APP_VERSION = "26.08.2026-v2"; 
                const savedVersion = localStorage.getItem("sipanda_version");
                
                if (savedVersion !== APP_VERSION) {
                    localStorage.setItem("sipanda_version", APP_VERSION);
                    window.location.reload(true);
                    return;
                }

                fetch(WEB_APP_URL + "?action=getInitData&v=" + APP_VERSION)
                    .then(res => res.json())
                    .then(data => {
                        setAppData({
                            settings: data.settings || {},
                            students: data.students || [],
                            exams: data.exams || [],
                            results: data.results || [],
                            materi: data.materi || []
                        });
                        setLoading(false);
                    })
                    .catch(err => {
                        console.error("Gagal koneksi ke spreadsheet:", err);
                        setLoading(false);
                    });
            }, []);

            const handleLogin = (user, role) => {
                setCurrentUser({ ...user, role });
                setView(role === 'admin' ? 'admin' : 'student');
            };

            const handleLogout = () => {
                setCurrentUser(null);
                setView('login');
                setActiveExamData(null);
                setSelectedMapel(null);
            };

            const startExam = (exam) => {
                const elem = document.documentElement;
                if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {});
                setActiveExamData(exam);
                setView('exam');
            };

            const finishExam = (examId, score, cheatCount) => {
                if (document.fullscreenElement || document.webkitFullscreenElement) {
                    if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
                }
                
                const examTitle = appData.exams.find(e => e.id === examId)?.title || 'Ujian';
                const timeStr = new Date().toLocaleString();
                
                const newResult = {
                    waktu: timeStr,
                    nisn: currentUser.nisn,
                    nama: currentUser.name,
                    ujian: examTitle,
                    nilai: score,
                    catatan: "",
                    pelanggaran: cheatCount || 0
                };

                setAppData(prev => ({
                    ...prev,
                    results: [...prev.results, newResult]
                }));

                fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "saveResult", ...newResult })
                });

                setView('student');
                setActiveExamData(null);
            };

            const handleToggleExamStatus = (examId) => {
                setAppData(prev => {
                    const updatedExams = prev.exams.map(ex => {
                        if (ex.id === examId) {
                            const newStatus = !ex.isActive;
                            fetch(WEB_APP_URL, {
                                method: 'POST',
                                mode: 'no-cors',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ action: "updateExamStatus", examId: examId, isActive: newStatus })
                            });
                            return { ...ex, isActive: newStatus };
                        }
                        return ex;
                    });
                    return { ...prev, exams: updatedExams };
                });
            };

            const handleUpdateCatatan = (nisn, ujian, newCatatan) => {
                setAppData(prev => {
                    const updatedResults = prev.results.map(r => {
                        if (r.nisn === nisn && r.ujian === ujian) {
                            return { ...r, catatan: newCatatan };
                        }
                        return r;
                    });
                    return { ...prev, results: updatedResults };
                });

                fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "updateCatatan", nisn: nisn, ujian: ujian, catatan: newCatatan })
                });
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-100">
                        <div className="text-center">
                            <div className="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                            <p className="text-slate-600 font-medium">Menghubungkan ke server kelas 6</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`min-h-screen ${view === 'exam' ? 'bg-slate-200' : 'bg-slate-100'} font-sans text-slate-800 flex flex-col`}>
                    {view !== 'exam' && (
                        <header className="bg-white shadow-sm sticky top-0 z-40">
                            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <img src={LOGO_URL} alt="Logo SIPANDA" className="w-10 h-10 rounded-xl object-contain bg-white p-0.5 border border-slate-200 shadow-sm" />
                                    <div>
                                        <h1 className="font-bold text-lg leading-tight text-blue-700">SI-PANDA</h1>
                                        <p className="text-xs text-slate-500">{appData.settings.schoolName || 'SD Negeri 3 Wonorejo'}</p>
                                    </div>
                                </div>
                                {currentUser && (
                                    <div className="flex items-center gap-4">
                                        <div className="hidden md:block text-right">
                                            <p className="text-sm font-semibold">{currentUser.name || 'Administrator'}</p>
                                            <p className="text-xs text-slate-500">{currentUser.role === 'admin' ? 'Guru' : `NISN: ${currentUser.nisn}`}</p>
                                        </div>
                                        <button onClick={handleLogout} className="p-2 text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-full transition-colors" title="Keluar">
                                            <Icon name="log-out" size={20} />
                                        </button>
                                    </div>
                                )}
                            </div>
                        </header>
                    )}

                    <main className={`flex-1 max-w-7xl mx-auto w-full ${view === 'exam' ? 'p-2 sm:p-6' : 'px-4 sm:px-6 lg:px-8 py-6'}`}>
                        {view === 'login' && <Login onLogin={handleLogin} students={appData.students} settings={appData.settings} />}
                        {view === 'admin' && (
                            <AdminDashboard 
                                exams={appData.exams} 
                                results={appData.results} 
                                students={appData.students} 
                                materiList={appData.materi} 
                                onToggleStatus={handleToggleExamStatus} 
                                onUpdateCatatan={handleUpdateCatatan} 
                            />
                        )}
                        {view === 'student' && (
                            !selectedMapel ? (
                                <StudentDashboard 
                                    exams={appData.exams} 
                                    results={appData.results} 
                                    currentUser={currentUser} 
                                    onStartExam={startExam} 
                                    onSelectMapel={setSelectedMapel} 
                                />
                            ) : (
                                <DaftarMateriView 
                                    mapel={selectedMapel} 
                                    materiList={appData.materi.filter(m => m.mapel === selectedMapel)} 
                                    onBack={() => setSelectedMapel(null)} 
                                />
                            )
                        )}
                        {view === 'exam' && <ExamInterface exam={activeExamData} currentUser={currentUser} onFinish={finishExam} />}
                    </main>
                </div>
            );
        }

        function Login({ onLogin, students, settings }) {
            const [nisn, setNisn] = useState('');
            const [matchedStudent, setMatchedStudent] = useState(null);
            const [error, setError] = useState('');
            
            const urlParams = new URLSearchParams(window.location.search);
            const isAdminRoute = urlParams.has(SECRET_KEY_PARAM);

            const [adminUser, setAdminUser] = useState('');
            const [adminPass, setAdminPass] = useState('');

            const handleNisnChange = (e) => {
                const val = e.target.value;
                setNisn(val);
                setError('');

                if (val.trim() === '') {
                    setMatchedStudent(null);
                    return;
                }

                const found = students.find(s => String(s.nisn).trim() === String(val).trim());
                if (found) {
                    setMatchedStudent(found);
                } else {
                    setMatchedStudent(null);
                }
            };

            const handleStudentLogin = (e) => {
                e.preventDefault();
                if (matchedStudent) {
                    onLogin(matchedStudent, 'student');
                } else {
                    setError('NISN tidak ditemukan di data sekolah. Periksa kembali.');
                }
            };

            const handleAdminLogin = async (e) => {
                e.preventDefault();
                const validUser = settings.adminUser || 'admin';
                const inputPassHash = await hashString(adminPass);
                const validPassHash = settings.adminPassHash || '240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9';

                if (adminUser === validUser && inputPassHash === validPassHash) {
                    onLogin({ name: 'Guru / Admin' }, 'admin');
                } else {
                    setError('Username atau Password salah.');
                }
            };

            return (
                <div className="max-w-md mx-auto mt-6 px-4">
                    <div className="text-center mb-6">
                        <img src={LOGO_URL} alt="Logo SIPANDA" className="w-20 h-20 rounded-2xl object-contain mx-auto mb-3 shadow-md bg-white p-2 border border-slate-100" />
                        <h2 className="text-2xl font-black text-slate-800">SI-PANDA</h2>
                        <p className="text-xs font-semibold text-blue-600 uppercase tracking-widest mt-0.5">Sistem Informasi Penugasan Digital Anak</p>
                        <p className="text-sm text-slate-500 mt-2 px-4 leading-relaxed">
                            Hai ! Silakan masukkan NISN untuk belajar ringkasan materi & mengerjakan tugas rumah kalian.
                        </p>
                    </div>

                    <div className="bg-white p-8 rounded-2xl shadow-lg border border-slate-100">
                        <h3 className="text-xl font-bold text-center mb-6 text-slate-800">
                            {isAdminRoute ? 'Masuk' : 'Login'}
                        </h3>

                        {error && <div className="mb-4 p-3 bg-red-50 text-red-600 text-sm rounded-lg flex items-start gap-2"><Icon name="alert-circle" size={18} className="shrink-0 mt-0.5"/>{error}</div>}

                        {!isAdminRoute ? (
                            <form onSubmit={handleStudentLogin} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">NISN</label>
                                    <input 
                                        type="text" 
                                        required 
                                        value={nisn} 
                                        onChange={handleNisnChange} 
                                        className="w-full px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500 font-mono text-base" 
                                        placeholder="Ketik NISN disini" 
                                        autoFocus
                                    />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">Nama</label>
                                    <div className={`w-full px-4 py-2.5 border rounded-lg text-sm font-bold flex items-center justify-between ${matchedStudent ? 'bg-green-50 border-green-200 text-green-800' : 'bg-slate-50 border-slate-200 text-slate-400'}`}>
                                        <span>{matchedStudent ? matchedStudent.name : (nisn ? 'NISN tidak terdaftar' : 'Menunggu NISN diketik...')}</span>
                                        {matchedStudent && <Icon name="check-circle" size={18} className="text-green-600 shrink-0" />}
                                    </div>
                                </div>

                                <button 
                                    type="submit" 
                                    disabled={!matchedStudent} 
                                    className="w-full py-3 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-200 disabled:text-slate-400 text-white rounded-lg font-semibold transition-colors mt-2 shadow-sm cursor-pointer disabled:cursor-not-allowed"
                                >
                                    LANJUT
                                </button>
                            </form>
                        ) : (
                            <form onSubmit={handleAdminLogin} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">Username</label>
                                    <input type="text" required value={adminUser} onChange={e => setAdminUser(e.target.value)} className="w-full px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">Password</label>
                                    <input type="password" required value={adminPass} onChange={e => setAdminPass(e.target.value)} className="w-full px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500" />
                                </div>
                                <button type="submit" className="w-full py-3 bg-slate-800 hover:bg-slate-900 text-white rounded-lg font-semibold transition-colors mt-2 shadow-sm">MASUK</button>
                            </form>
                        )}
                    </div>
                </div>
            );
        }

        function StudentDashboard({ exams, results, currentUser, onStartExam, onSelectMapel }) {
            const activeExams = exams.filter(e => e.isActive);
            const totalExams = activeExams.length;
            const studentResults = (results || []).filter(r => r.nisn === currentUser.nisn);
            const completedCount = activeExams.filter(exam => 
                studentResults.some(r => r.ujian === exam.title)
            ).length;
            const pendingCount = totalExams - completedCount;

            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                        <div>
                            <h2 className="text-xl font-bold">Hallo, {currentUser.name}!</h2>
                            <p className="text-slate-500 text-sm mt-1">Lihat ringkasan materi pelajaran dan daftar tugas rumahmu.</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4">
                            <div className="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center font-bold">
                                <Icon name="file-text" size={24} />
                            </div>
                            <div>
                                <p className="text-xs text-slate-500 font-semibold uppercase">Total Tugas</p>
                                <h3 className="text-2xl font-black text-slate-800">{totalExams}</h3>
                            </div>
                        </div>

                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4">
                            <div className="w-12 h-12 bg-green-50 text-green-600 rounded-xl flex items-center justify-center font-bold">
                                <Icon name="check-circle" size={24} />
                            </div>
                            <div>
                                <p className="text-xs text-slate-500 font-semibold uppercase">Sudah Dikerjakan</p>
                                <h3 className="text-2xl font-black text-green-600">{completedCount}</h3>
                            </div>
                        </div>

                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4">
                            <div className="w-12 h-12 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center font-bold">
                                <Icon name="clock" size={24} />
                            </div>
                            <div>
                                <p className="text-xs text-slate-500 font-semibold uppercase">Belum Dikerjakan</p>

        function ExamInterface({ exam, currentUser, onFinish }) {
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [answers, setAnswers] = useState({});
            const [timeLeft, setTimeLeft] = useState(exam.duration * 60);
            const [isFinished, setIsFinished] = useState(false);
            const [shuffledQuestions, setShuffledQuestions] = useState([]);
            
            const [showConfirmModal, setShowConfirmModal] = useState(false);
            const [showTimeUpModal, setShowTimeUpModal] = useState(false);
            const [showCheatModal, setShowCheatModal] = useState(false);
            const [cheatWarningCount, setCheatWarningCount] = useState(0);
            
            const sessionKey = `cbt_exam_${currentUser.nisn}_${exam.id}`;

            useEffect(() => {
                const savedSession = localStorage.getItem(sessionKey);
                if (savedSession) {
                    const parsed = JSON.parse(savedSession);
                    setAnswers(parsed.answers || {});
                    setTimeLeft(parsed.timeLeft || exam.duration * 60);
                    setShuffledQuestions(parsed.shuffledQuestions || exam.questions);
                    setCheatWarningCount(parsed.cheatWarningCount || 0);
                } else {
                    const randomlyShuffled = shuffleArray(exam.questions);
                    setShuffledQuestions(randomlyShuffled);
                    localStorage.setItem(sessionKey, JSON.stringify({ answers: {}, timeLeft: exam.duration * 60, shuffledQuestions: randomlyShuffled, cheatWarningCount: 0 }));
                }
            }, []);

            useEffect(() => {
                if (isFinished || showTimeUpModal || shuffledQuestions.length === 0) return;
                const timer = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev <= 1) { clearInterval(timer); setShowTimeUpModal(true); return 0; }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [isFinished, showTimeUpModal, shuffledQuestions]);

            useEffect(() => {
                if (isFinished) return;
                const preventDefault = e => e.preventDefault();
                const handleVisibility = () => {
                    if (document.hidden) {
                        setCheatWarningCount(prev => {
                            const newCount = prev + 1;
                            localStorage.setItem(sessionKey, JSON.stringify({ answers, timeLeft, shuffledQuestions, cheatWarningCount: newCount }));
                            return newCount;
                        });
                        setShowCheatModal(true);
                    }
                };
                document.addEventListener('contextmenu', preventDefault);
                document.addEventListener('copy', preventDefault);
                document.addEventListener('paste', preventDefault);
                document.addEventListener('visibilitychange', handleVisibility);
                return () => {
                    document.removeEventListener('contextmenu', preventDefault);
                    document.removeEventListener('copy', preventDefault);
                    document.removeEventListener('paste', preventDefault);
                    document.removeEventListener('visibilitychange', handleVisibility);
                };
            }, [isFinished, answers, timeLeft, shuffledQuestions]);

            const handleAnswer = (qId, optIdx) => {
                const newAns = { ...answers, [qId]: optIdx };
                setAnswers(newAns);
                localStorage.setItem(sessionKey, JSON.stringify({ answers: newAns, timeLeft, shuffledQuestions, cheatWarningCount }));
            };

            const submitExam = () => {
                setShowConfirmModal(false);
                setShowTimeUpModal(false);
                setShowCheatModal(false);
                setIsFinished(true);
                let correct = 0;
                shuffledQuestions.forEach(q => { if (answers[q.id] === q.answer) correct++; });
                const score = Math.round((correct / shuffledQuestions.length) * 100);
                localStorage.removeItem(sessionKey);
                onFinish(exam.id, score, cheatWarningCount);
            };

            const formatTime = s => `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
            if (shuffledQuestions.length === 0) return null;
            const question = shuffledQuestions[currentQIndex];

            return (
                <div className="flex flex-col md:flex-row gap-6 relative exam-mode w-full h-full max-w-6xl mx-auto">
                    {showCheatModal && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md flex items-center justify-center z-[100] p-4">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 text-center border-t-8 border-red-600">
                                <h3 className="text-2xl font-black text-slate-800 mb-2 uppercase">Peringatan Keras!</h3>
                                <p className="text-slate-600 text-sm mb-4">Dilarang meninggalkan halaman ujian.</p>
                                <div className="bg-red-50 text-red-800 p-3 rounded-lg mb-6 font-bold">Pelanggaranmu: {cheatWarningCount} Kali</div>
                                <button onClick={() => setShowCheatModal(false)} className="w-full py-3.5 rounded-xl font-bold bg-red-600 text-white shadow-lg cursor-pointer">KEMBALI</button>
                            </div>
                        </div>
                    )}
                    {showConfirmModal && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                            <div className="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 text-center">
                                <h3 className="text-xl font-bold mb-2">Sudah Selesai ?</h3>
                                <p className="text-slate-500 text-sm mb-6">Yakin ingin keluar ?</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setShowConfirmModal(false)} className="flex-1 py-2.5 rounded-xl bg-slate-100 font-semibold cursor-pointer">Batal</button>
                                    <button onClick={submitExam} className="flex-1 py-2.5 rounded-xl bg-blue-600 text-white font-semibold cursor-pointer">Ya, Selesai</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="flex-1 bg-white rounded-2xl shadow-sm border p-6 flex flex-col h-full">
                        <div className="border-b pb-3 mb-4 flex justify-between items-center">
                            <h3 className="font-bold text-lg">Soal {currentQIndex + 1}</h3>
                            <div className="md:hidden font-mono font-bold text-blue-700">{formatTime(timeLeft)}</div>
                        </div>
                        <div className="flex-1 text-lg overflow-y-auto mb-4">
                            <div className="mb-6 leading-relaxed">{renderContent(question.text)}</div>
                            <div className="space-y-3">
                                {question.options.map((opt, idx) => (
                                    <label key={idx} className={`flex items-start gap-4 p-4 rounded-xl border-2 cursor-pointer transition-all ${answers[question.id] === idx ? 'border-blue-500 bg-blue-50' : 'border-slate-200'}`}>
                                        <input type="radio" name={`q-${question.id}`} checked={answers[question.id] === idx} onChange={() => handleAnswer(question.id, idx)} className="w-5 h-5 mt-1 text-blue-600" />
                                        <div className="flex-1 text-base">{renderContent(opt)}</div>
                                    </label>
                                ))}
                            </div>
                        </div>
                        <div className="border-t pt-4 flex justify-between">
                            <button onClick={() => setCurrentQIndex(prev => Math.max(0, prev - 1))} disabled={currentQIndex === 0} className="px-4 py-2 text-sm font-semibold border rounded-lg bg-white disabled:opacity-50 cursor-pointer"><Icon name="chevron-left" size={16}/> Back</button>
                            {currentQIndex === shuffledQuestions.length - 1 ? (
                                <button onClick={() => setShowConfirmModal(true)} className="px-6 py-2 bg-green-600 text-white rounded-lg text-sm font-bold cursor-pointer">Selesai</button>
                            ) : (
                                <button onClick={() => setCurrentQIndex(prev => Math.min(shuffledQuestions.length - 1, prev + 1))} className="px-4 py-2 text-white bg-blue-600 rounded-lg text-sm font-semibold cursor-pointer">Next <Icon name="chevron-right" size={16}/></button>
                            )}
                        </div>
                    </div>

                    <div className="w-full md:w-80 flex flex-col gap-4">
                        <div className="hidden md:flex bg-white p-5 rounded-2xl shadow-sm border flex-col items-center justify-center">
                            <span className="text-slate-500 text-sm mb-1 font-medium">Sisa Waktu</span>
                            <div className={`text-4xl font-mono font-bold ${timeLeft < 300 ? 'text-red-500 animate-pulse' : 'text-slate-800'}`}>{formatTime(timeLeft)}</div>
                        </div>
                        <div className="bg-white p-5 rounded-2xl shadow-sm border">
                            <h3 className="font-bold text-sm mb-4 text-slate-700 text-center border-b pb-2">Daftar Soal</h3>
                            <div className="flex flex-wrap gap-2 justify-center">
                                {shuffledQuestions.map((q, idx) => {
                                    const isAnswered = answers[q.id] !== undefined;
                                    return (
                                        <button key={q.id} onClick={() => setCurrentQIndex(idx)} className={`w-10 h-10 rounded-lg text-sm font-bold border-2 cursor-pointer ${currentQIndex === idx ? 'ring-2 ring-blue-300' : ''} ${isAnswered ? 'bg-green-500 text-white border-green-600' : 'bg-red-500 text-white border-red-600'}`}>{idx + 1}</button>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function AdminDashboard({ exams, results, students, materiList, onToggleStatus, onUpdateCatatan }) {
            const [activeTab, setActiveTab] = useState('overview');
            const [loadingMateri, setLoadingMateri] = useState(false);

            // State untuk Pantau Siswa
            const [selectedFilterStatus, setSelectedFilterStatus] = useState('ALL'); 
            const [selectedExamFilter, setSelectedExamFilter] = useState(exams.length > 0 ? exams[0].title : '');
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedMapelFilter, setSelectedMapelFilter] = useState('ALL');

            // State untuk Filter Kelola Materi
            const [selectedMateriMapelFilter, setSelectedMateriMapelFilter] = useState('ALL');

            const handleAddMateri = async (e) => {
                e.preventDefault();
                const form = e.target;
                const mapel = form.mapel.value;
                const judul = form.judul.value;
                const pdf = form.pdf.value;
                const gambar = form.gambar.value;

                setLoadingMateri(true);
                try {
                    await google.script.run
                        .withSuccessHandler(() => {
                            alert("Materi berhasil ditambahkan!");
                            form.reset();
                            window.location.reload();
                        })
                        .withFailureHandler((err) => {
                            alert("Gagal menyimpan materi: " + err.message);
                            setLoadingMateri(false);
                        })
                        .addMateriToSheet({ mapel, judul, pdf, gambar });
                } catch (error) {
                    fetch(WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: "addMateri", mapel, judul, pdf, gambar })
                    });
                    alert("Permintaan simpan materi dikirim!");
                    setLoadingMateri(false);
                    form.reset();
                    window.location.reload();
                }
            };

            // Logika Perhitungan & Filter Pantau Siswa
            const totalStudents = students.length;
            const examResults = (results || []).filter(r => r.ujian === selectedExamFilter);
            const doneNisns = new Set(examResults.map(r => String(r.nisn)));
            
            const completedCount = doneNisns.size;
            const pendingCount = Math.max(0, totalStudents - completedCount);

            const studentStatusList = students.map(student => {
                const isDone = doneNisns.has(String(student.nisn));
                const res = examResults.find(r => String(r.nisn) === String(student.nisn));
                return {
                    ...student,
                    isDone,
                    nilai: isDone ? res.nilai : '-',
                    waktu: isDone ? res.waktu : '-',
                    pelanggaran: isDone ? res.pelanggaran : 0,
                    catatan: isDone ? res.catatan : ''
                };
            });

            const filteredStudents = studentStatusList.filter(s => {
                if (selectedFilterStatus === 'DONE' && !s.isDone) return false;
                if (selectedFilterStatus === 'PENDING' && s.isDone) return false;

                if (searchQuery.trim() !== '') {
                    const q = searchQuery.toLowerCase();
                    const matchName = s.name.toLowerCase().includes(q);
                    const matchNisn = String(s.nisn).toLowerCase().includes(q);
                    if (!matchName && !matchNisn) return false;
                }

                return true;
            });

            // Logika Filter Kelola Materi
            const filteredMateriList = (!materiList || materiList.length === 0) ? [] : materiList.filter(item => {
                if (selectedMateriMapelFilter === 'ALL') return true;
                return item.mapel === selectedMateriMapelFilter;
            });

            return (
                <div className="bg-white rounded-2xl shadow-sm border overflow-hidden flex flex-col md:flex-row min-h-[600px]">
                    <div className="w-full md:w-64 bg-slate-50 border-r p-4">
                        <h2 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4 px-3">Menu Guru</h2>
                        <nav className="space-y-1">
                            <button onClick={() => setActiveTab('overview')} className={`w-full text-left px-3 py-2.5 rounded-xl text-sm font-semibold cursor-pointer ${activeTab === 'overview' ? 'bg-blue-100 text-blue-700' : 'text-slate-600'}`}>📊 Pantau Siswa</button>
                            <button onClick={() => setActiveTab('exams')} className={`w-full text-left px-3 py-2.5 rounded-xl text-sm font-semibold cursor-pointer ${activeTab === 'exams' ? 'bg-blue-100 text-blue-700' : 'text-slate-600'}`}>Kelola Status</button>
                            <button onClick={() => setActiveTab('results')} className={`w-full text-left px-3 py-2.5 rounded-xl text-sm font-semibold cursor-pointer ${activeTab === 'results' ? 'bg-blue-100 text-blue-700' : 'text-slate-600'}`}>Rekap Nilai</button>
                            <button onClick={() => setActiveTab('materi')} className={`w-full text-left px-3 py-2.5 rounded-xl text-sm font-semibold cursor-pointer ${activeTab === 'materi' ? 'bg-blue-100 text-blue-700' : 'text-slate-600'}`}>Kelola Materi</button>
                        </nav>
                    </div>
                    <div className="flex-1 p-6 overflow-y-auto">
                        {activeTab === 'overview' && (
                            <div className="space-y-6">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-slate-50 p-4 rounded-2xl border">
                                    <div>
                                        <h3 className="text-lg font-bold text-slate-800">Review Pengerjaan Tugas</h3>
                                        <p className="text-xs text-slate-500">Pilih tugas/ujian, mapel, atau cari nama siswa untuk melihat status.</p>
                                    </div>
                                    <div className="w-full sm:w-auto">
                                        <select 
                                            value={selectedExamFilter} 
                                            onChange={(e) => setSelectedExamFilter(e.target.value)}
                                            className="w-full sm:w-auto px-3.5 py-2 border rounded-xl text-xs font-bold bg-white outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer"
                                        >
                                            {exams.map((ex, idx) => (
                                                <option key={idx} value={ex.title}>{ex.title}</option>
                                            ))}
                                        </select>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Cari Nama / NISN Siswa</label>
                                        <input 
                                            type="text" 
                                            placeholder="Ketik nama atau NISN..." 
                                            value={searchQuery || ''}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            className="w-full px-3.5 py-2 border rounded-xl text-xs bg-white outline-none focus:ring-2 focus:ring-blue-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Mata Pelajaran</label>
                                        <select 
                                            value={selectedMapelFilter || 'ALL'}
                                            onChange={(e) => {
                                                const val = e.target.value;
                                                setSelectedMapelFilter(val);
                                                if(val !== 'ALL') {
                                                    const matchedExam = exams.find(ex => ex.title.toLowerCase().includes(val.toLowerCase()));
                                                    if(matchedExam) setSelectedExamFilter(matchedExam.title);
                                                }
                                            }}
                                            className="w-full px-3.5 py-2 border rounded-xl text-xs font-semibold bg-white outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer"
                                        >
                                            <option value="ALL">Semua Mapel</option>
                                            {MAPEL_LIST.map((m, idx) => (
                                                <option key={idx} value={m}>{m}</option>
                                            ))}
                                        </select>
                                    </div>
                                </div>

                                {/* Card Statistik Interaktif (Klik card memfilter tabel) */}
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                    <div 
                                        onClick={() => setSelectedFilterStatus('ALL')}
                                        className={`bg-white p-5 rounded-2xl shadow-sm border cursor-pointer transition-all hover:border-blue-400 ${selectedFilterStatus === 'ALL' ? 'ring-2 ring-blue-500 bg-blue-50/20' : 'border-slate-100'}`}
                                    >
                                        <div className="flex items-center gap-4">
                                            <div className="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center font-bold">
                                                <Icon name="file-text" size={24} />
                                            </div>
                                            <div>
                                                <p className="text-xs text-slate-500 font-semibold uppercase">Total Siswa</p>
                                                <h3 className="text-2xl font-black text-slate-800">{totalStudents}</h3>
                                            </div>
                                        </div>
                                        <p className="text-[11px] text-blue-600 font-semibold mt-3">Lihat semua →</p>
                                    </div>

                                    <div 
                                        onClick={() => setSelectedFilterStatus('DONE')}
                                        className={`bg-white p-5 rounded-2xl shadow-sm border cursor-pointer transition-all hover:border-green-400 ${selectedFilterStatus === 'DONE' ? 'ring-2 ring-green-500 bg-green-50/20' : 'border-slate-100'}`}
                                    >
                                        <div className="flex items-center gap-4">
                                            <div className="w-12 h-12 bg-green-50 text-green-600 rounded-xl flex items-center justify-center font-bold">
                                                <Icon name="check-circle" size={24} />
                                            </div>
                                            <div>
                                                <p className="text-xs text-slate-500 font-semibold uppercase">Sudah Mengerjakan</p>
                                                <h3 className="text-2xl font-black text-green-600">{completedCount}</h3>
                                            </div>
                                        </div>
                                        <p className="text-[11px] text-green-600 font-semibold mt-3">Lihat semua →</p>
                                    </div>

                                    <div 
                                        onClick={() => setSelectedFilterStatus('PENDING')}
                                        className={`bg-white p-5 rounded-2xl shadow-sm border cursor-pointer transition-all hover:border-amber-400 ${selectedFilterStatus === 'PENDING' ? 'ring-2 ring-amber-500 bg-amber-50/20' : 'border-slate-100'}`}
                                    >
                                        <div className="flex items-center gap-4">
                                            <div className="w-12 h-12 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center font-bold">
                                                <Icon name="clock" size={24} />
                                            </div>
                                            <div>
                                                <p className="text-xs text-slate-500 font-semibold uppercase">Belum Mengerjakan</p>
                                                <h3 className="text-2xl font-black text-amber-600">{pendingCount}</h3>
                                            </div>
                                        </div>
                                        <p className="text-[11px] text-amber-600 font-semibold mt-3">Lihat semua →</p>
                                    </div>
                                </div>

                                <div className="bg-white border rounded-2xl overflow-hidden shadow-sm">
                                    <div className="p-4 bg-slate-50 border-b flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                        <h4 className="font-bold text-sm text-slate-700">
                                            Daftar Siswa ({selectedFilterStatus === 'ALL' ? 'Semua' : selectedFilterStatus === 'DONE' ? 'Sudah Selesai' : 'Belum Selesai'}) - <span className="text-blue-600">{selectedExamFilter}</span>
                                        </h4>
                                        {(selectedFilterStatus !== 'ALL' || searchQuery || (selectedMapelFilter && selectedMapelFilter !== 'ALL')) && (
                                            <button 
                                                onClick={() => { setSelectedFilterStatus('ALL'); setSearchQuery(''); setSelectedMapelFilter('ALL'); }} 
                                                className="text-xs text-blue-600 font-bold hover:underline cursor-pointer"
                                            >
                                                Reset 
                                            </button>
                                        )}
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-sm text-left">
                                            <thead className="bg-slate-50/50 border-b text-xs text-slate-500">
                                                <tr>
                                                    <th className="p-3">NISN</th>
                                                    <th className="p-3">Nama Siswa</th>
                                                    <th className="p-3 text-center">Status Pengerjaan</th>
                                                    <th className="p-3 text-center">Nilai</th>
                                                    <th className="p-3">Waktu Pengumpulan</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {filteredStudents.length === 0 ? (
                                                    <tr><td colSpan="5" className="p-6 text-center text-slate-400">Tidak ada data siswa yang sesuai.</td></tr>
                                                ) : (
                                                    filteredStudents.map((s, idx) => (
                                                        <tr key={idx} className="border-b hover:bg-slate-50/50">
                                                            <td className="p-3 font-mono text-xs">{s.nisn}</td>
                                                            <td className="p-3 font-bold text-slate-800">{s.name}</td>
                                                            <td className="p-3 text-center">
                                                                {s.isDone ? (
                                                                    <span className="px-2.5 py-1 bg-green-100 text-green-700 text-xs font-bold rounded-full inline-block">Sudah Selesai</span>
                                                                ) : (
                                                                    <span className="px-2.5 py-1 bg-amber-100 text-amber-700 text-xs font-bold rounded-full inline-block">Belum Mengerjakan</span>
                                                                )}
                                                            </td>
                                                            <td className="p-3 text-center font-black text-blue-600">{s.nilai}</td>
                                                            <td className="p-3 text-xs text-slate-500">{s.waktu}</td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}
                        {activeTab === 'exams' && (
                            <div>
                                <h3 className="text-lg font-bold mb-2">Kelola Status</h3>
                                <p className="text-xs text-slate-500 mb-6">Klik tombol status untuk mengaktifkan atau menonaktifkan tugas.</p>
                                <div className="space-y-3">
                                    {exams.map(e => (
                                        <div key={e.id} className="border p-4 rounded-xl bg-white flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 shadow-sm">
                                            <div>
                                                <h4 className="font-bold text-slate-800">{e.title}</h4>
                                                <p className="text-xs text-slate-500">ID: {e.id} | {e.questions.length} Soal | {e.duration} Menit</p>
                                            </div>
                                            <button 
                                                onClick={() => onToggleStatus(e.id)}
                                                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-sm cursor-pointer ${e.isActive ? 'bg-green-100 text-green-700 hover:bg-green-200 border border-green-300' : 'bg-slate-100 text-slate-500 hover:bg-slate-200 border border-slate-300'}`}
                                            >
                                                {e.isActive ? '🟢 AKTIF (Klik untuk Matikan)' : '⚪ NON-AKTIF (Klik untuk Aktifkan)'}
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                        {activeTab === 'results' && (
                            <div>
                                <h3 className="text-lg font-bold mb-2">Rekap Nilai & Catatan</h3>
                                <p className="text-xs text-slate-500 mb-6">Klik tombol "Catatan" untuk memberi catatan.</p>
                                <div className="overflow-x-auto border rounded-xl bg-white">
                                    <table className="w-full text-sm text-left">
                                        <thead className="bg-slate-50 border-b">
                                            <tr>
                                                <th className="p-3">Waktu</th>
                                                <th className="p-3">NISN</th>
                                                <th className="p-3">Nama</th>
                                                <th className="p-3">Ujian</th>
                                                <th className="p-3 text-center">Nilai</th>
                                                <th className="p-3 text-center">Pelanggaran</th>
                                                <th className="p-3 w-72">Catatan</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {(!results || results.length === 0) ? (
                                                <tr><td colSpan="7" className="p-6 text-center text-slate-400">Belum ada data masuk.</td></tr>
                                            ) : (
                                                results.map((r, idx) => (
                                                    <ResultRow key={`${r.nisn}-${r.ujian}-${idx}`} r={r} onUpdateCatatan={onUpdateCatatan} />
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                        {activeTab === 'materi' && (
                            <div className="space-y-6">
                                {/* Form Tambah Materi */}
                                <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200">
                                    <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
                                        <Icon name="book-open" size={18} className="text-blue-600"/> 
                                        Tambah Materi Baru
                                    </h3>
                                    <form onSubmit={handleAddMateri} className="space-y-4">
                                        <div>
                                            <label className="block text-xs font-medium text-slate-700 mb-1">Mata Pelajaran</label>
                                            <select 
                                                name="mapel" 
                                                required 
                                                className="w-full px-3.5 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white cursor-pointer"
                                            >
                                                <option value="">-- Pilih Mapel --</option>
                                                {MAPEL_LIST.map((m, idx) => (
                                                    <option key={idx} value={m}>{m}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-700 mb-1">Judul Materi</label>
                                            <input 
                                                type="text" 
                                                name="judul" 
                                                required 
                                                placeholder="Contoh: Pecahan Desimal" 
                                                className="w-full px-3.5 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white"
                                            />
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-medium text-slate-700 mb-1">Link File</label>
                                                <input 
                                                    type="url" 
                                                    name="pdf" 
                                                    placeholder="Tempel link disini..." 
                                                    className="w-full px-3.5 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 text-sm font-mono bg-white"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-medium text-slate-700 mb-1">Link Cover</label>
                                                <input 
                                                    type="url" 
                                                    name="gambar" 
                                                    placeholder="Tempel link disini..." 
                                                    className="w-full px-3.5 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 text-sm font-mono bg-white"
                                                />
                                            </div>
                                        </div>
                                        <button 
                                            type="submit" 
                                            disabled={loadingMateri}
                                            className="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-xs transition-colors shadow-sm cursor-pointer disabled:opacity-50"
                                        >
                                            {loadingMateri ? 'Menyimpan...' : 'Simpan & Terbitkan Materi'}
                                        </button>
                                    </form>
                                </div>

                                {/* Daftar Materi Aktif dengan Fitur Filter Mapel */}
                                <div>
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-3">
                                        <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                                            <Icon name="list" size={18} className="text-blue-600"/> 
                                            Daftar Materi ({filteredMateriList.length})
                                        </h3>
                                        <div className="w-full sm:w-auto">
                                            <select 
                                                value={selectedMateriMapelFilter} 
                                                onChange={(e) => setSelectedMateriMapelFilter(e.target.value)}
                                                className="w-full sm:w-auto px-3 py-1.5 border rounded-xl text-xs font-semibold bg-white outline-none focus:ring-2 focus:ring-blue-500 text-slate-700 cursor-pointer"
                                            >
                                                <option value="ALL">Semua Mapel</option>
                                                {MAPEL_LIST.map((m, idx) => (
                                                    <option key={idx} value={m}>Filter: {m}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>

                                    <div className="space-y-3">
                                        {filteredMateriList.length === 0 ? (
                                            <p className="text-sm text-slate-400 italic p-4 bg-slate-50 rounded-xl border text-center">Belum ada materi.</p>
                                        ) : (
                                            filteredMateriList.map((item, idx) => (
                                                <div key={idx} className="p-4 bg-white border border-slate-200 rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 shadow-sm">
                                                    <div className="flex items-center gap-3">
                                                        <img 
                                                            src={item.gambar || 'https://via.placeholder.com/80?text=Img'} 
                                                            alt={item.judul} 
                                                            className="w-12 h-14 rounded-lg object-cover border shrink-0 bg-slate-50"
                                                            onError={(e) => { e.target.onerror = null; e.target.src = 'https://via.placeholder.com/80?text=Img'; }}
                                                        />
                                                        <div>
                                                            <span className="inline-block px-2 py-0.5 bg-blue-50 text-blue-700 text-[10px] font-bold rounded-md mb-1">{item.mapel}</span>
                                                            <h4 className="font-bold text-slate-800 text-sm">{item.judul}</h4>
                                                        </div>
                                                    </div>
                                                    {item.pdf && (
                                                        <a href={item.pdf} target="_blank" rel="noopener noreferrer" className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold transition-colors">
                                                            Buka PDF
                                                        </a>
                                                    )}
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
